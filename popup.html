<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ReRes</title>
    <link rel="stylesheet" href="css/ui.css">
</head>
<body class="popup">
<header class="bar">
    <div class="brand">ReRes <small>MV3</small></div>
    <div class="spacer"></div>
    <button id="addBtn" class="btn btn-ghost btn-xs" type="button">+ 添加规则</button>
</header>

<main>
    <div id="status" class="status">
        <span class="dot"></span>
        <span id="statusText">正在读取规则…</span>
    </div>

    <form id="form" class="form" hidden>
        <div class="field">
            <label for="req">If URL match（JS 正则，不要写首尾的 / 和 /gi）</label>
            <input id="req" type="text" spellcheck="false" placeholder="^https?://cdn\.example\.com/static/">
        </div>
        <div class="field">
            <label for="res">Response（http(s):// 地址或 file:///local/文件名）</label>
            <input id="res" type="text" spellcheck="false" placeholder="http://127.0.0.1:5500/static/">
        </div>
        <div class="field">
            <label for="group">Group（可选）</label>
            <input id="group" type="text" spellcheck="false" placeholder="项目名">
        </div>
        <p class="hint">Response 会替换掉 URL 中与正则匹配的部分，可用 $1 引用捕获组。</p>
        <div id="formError" class="form-error" hidden></div>
        <div class="actions">
            <button class="btn btn-primary" type="submit">保存</button>
            <button id="cancelBtn" class="btn btn-light" type="button">取消</button>
        </div>
    </form>

    <div id="list"></div>
</main>

<footer class="foot">
    <a id="optionsLink" href="options.html" target="_blank">管理规则</a>
    <a href="https://github.com/annnhan/ReRes" target="_blank">GitHub</a>
    <span class="spacer"></span>
    <span id="count"></span>
</footer>

<script src="js/rule-engine.js"></script>
<script src="js/shared.js"></script>
<script src="js/popup.js"></script>
</body>
</html>
